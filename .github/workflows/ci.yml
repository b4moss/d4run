name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck bats
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck bats

      - name: Shellcheck
        run: shellcheck init-project.sh || true

      - name: Bats smoke
        run: bats tests/

      - name: Emit coverage stub for Codecov wiring
        run: |
          mkdir -p coverage
          {
            echo 'TN:'
            echo 'SF:init-project.sh'
            echo 'DA:1,1'
            echo 'end_of_record'
          } > coverage/lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          fail_ci_if_error: false
          verbose: true
